<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据库操作结果大屏 (解耦版)</title>
    <style>
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; margin: 0; padding: 20px; box-sizing: border-box; }
        .container { background: rgba(255, 255, 255, 0.95); width: 100%; max-width: 700px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); overflow: hidden; }
        .banner { width: 100%; height: 180px; background: url('https://images.unsplash.com/photo-1550751827-4bd374c3f58b?auto=format&fit=crop&w=800&q=80') center/cover; position: relative; }
        .banner-title { position: absolute; bottom: 15px; left: 20px; color: white; font-size: 28px; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.7); margin: 0; }
        .content { padding: 30px; }
        .log-box { background: #e8f4f8; border-left: 5px solid #3498db; padding: 15px; border-radius: 5px; color: #2c3e50; font-size: 14px; margin-bottom: 25px; line-height: 1.6; }
        table { width: 100%; border-collapse: collapse; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-radius: 8px; overflow: hidden; }
        th { background: linear-gradient(to right, #6a11cb 0%, #2575fc 100%); color: white; padding: 15px; font-size: 16px; text-align: center; }
        td { padding: 12px; text-align: center; border-bottom: 1px solid #eee; color: #34495e; font-size: 15px; }
        tr:hover { background-color: #f1f9ff; transition: background-color 0.3s; }
        .footer { background: #2c3e50; color: #ecf0f1; padding: 20px; text-align: center; font-size: 16px; border-top: 3px solid #e74c3c; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .badge { background: #e74c3c; color: white; padding: 5px 15px; border-radius: 20px; font-weight: bold; font-size: 14px; letter-spacing: 1px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="banner">
            <h1 class="banner-title">💻 JDBC 前后端分离可视化</h1>
        </div>
        
        <div class="content">
            <h3 style="color: #2c3e50; margin-top: 0;">⚙️ 后台执行日志</h3>
            <div class="log-box" id="log-box">⏳ 正在通过 AJAX 连接数据库并异步获取状态...</div>
            
            <h3 style="color: #2c3e50;">📊 数据库查询的结果</h3>
            <table id="data-table">
                <thead>
                    <tr><th>ID (编号)</th><th>Name (姓名)</th></tr>
                </thead>
                <tbody>
                    </tbody>
            </table>
        </div>
        
        <div class="footer">
            <div class="badge">STUDENT INFO</div>
            <div>👨‍🎓 姓名：<strong>党子立</strong> &nbsp;&nbsp;|&nbsp;&nbsp; 🆔 学号：<strong>2220162402009</strong></div>
            <div style="font-size: 12px; color: #95a5a6;">前端纯 HTML 抽离文件 · 基于标准异步 Fetch API 交互</div>
        </div>
    </div>

    <script>
        window.onload = function() {
            // 向后端的 /api/data 发起异步请求获取接口数据
            fetch('api/data')
                .then(response => response.json())
                .then(res => {
                    const logBox = document.getElementById('log-box');
                    const tbody = document.querySelector('#data-table tbody');
                    
                    // 1. 动态渲染执行日志
                    logBox.innerHTML = res.log;
                    
                    // 2. 如果后端提取成功，遍历 JSON 数据动态插入表格行
                    if (res.success) {
                        res.data.forEach(item => {
                            const row = document.createElement('tr');
                            row.innerHTML = `<td>${item.id}</td><td><strong>${item.name}</strong></td>`;
                            tbody.appendChild(row);
                        });
                    }
                })
                .catch(err => {
                    document.getElementById('log-box').innerHTML = "❌ 请求后端 API 异常: " + err;
                });
        };
    </script>
</body>
</html>

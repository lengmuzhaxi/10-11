<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SSM 综合管理系统 - codespace 部署版</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --secondary-color: #06b6d4;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
        }

        /* 1) 个人标识专属样式头部 */
        .student-identity-banner {
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
            color: #ffffff;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .student-identity-banner h1 {
            margin: 0;
            font-size: 24px;
            letter-spacing: 1px;
            background: linear-gradient(to right, #67e8f9, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .student-info-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
        }

        .student-info-box span {
            color: #fbbf24;
            margin-left: 5px;
        }

        /* 2) 页面布局与卡片丰富设计 */
        .container {
            max-width: 1300px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .section-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 40px;
        }

        @media (max-width: 900px) {
            .section-grid { grid-template-columns: 1fr; }
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03);
            padding: 25px;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-2px);
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f1f5f9;
            color: var(--primary-color);
            display: flex;
            align-items: center;
        }

        /* 表单样式美化 */
        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-muted);
        }

        .form-control {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .btn {
            background: linear-gradient(to right, var(--primary-color), #6366f1);
            color: white;
            border: none;
            padding: 11px 20px;
            font-size: 14px;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
        }

        .btn:hover { opacity: 0.9; }

        /* 精美表格渲染 */
        .table-responsive {
            overflow-x: auto;
            margin-top: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }

        th {
            background-color: #f1f5f9;
            color: var(--text-main);
            padding: 12px;
            font-weight: 600;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #e2e8f0;
            color: #475569;
        }

        tr:hover { background-color: #f8fafc; }

        .badge {
            display: inline-block;
            padding: 3px 8px;
            font-size: 12px;
            font-weight: 500;
            border-radius: 9999px;
            background-color: #e0f2fe;
            color: #0369a1;
        }
    </style>
</head>
<body>

    <div class="student-identity-banner">
        <div>
            <h1>SSM 框架开发实践大作业</h1>
            <small style="color: #94a3b8;">基于 Spring + MyBatis + Embedded H2 Database</small>
        </div>
        <div class="student-info-box">
            开发者学号: <span>220162402009</span> | 姓名: <span>党子立</span>
        </div>
    </div>

    <div class="container">
        <div class="section-grid">
            <div class="card">
                <div class="card-title">📦 添加商品信息 (Spring IoC & JDBC 整合)</div>
                <form th:action="@{/addGoods}" method="post">
                    <div class="form-group">
                        <label>商品名称：</label>
                        <input type="text" name="name" class="form-control" placeholder="例如：百合花" required />
                    </div>
                    <div class="form-group">
                        <label>商品价格 (元)：</label>
                        <input type="number" step="0.01" name="price" class="form-control" placeholder="例如：25.5" required />
                    </div>
                    <div class="form-group">
                        <label>商品类别：</label>
                        <input type="text" name="type" class="form-control" placeholder="例如：植物" required />
                    </div>
                    <button type="submit" class="btn">提交添加至数据库</button>
                </form>
            </div>

            <div class="card">
                <div class="card-title">👤 用户数据持久化映射 (MyBatis 核心实践)</div>
                <form th:action="@{/addUser}" method="post">
                    <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                        <div>
                            <label>用户账号ID：</label>
                            <input type="text" name="userId" class="form-control" placeholder="userId" required />
                        </div>
                        <div>
                            <label>用户姓名：</label>
                            <input type="text" name="userName" class="form-control" placeholder="姓名" required />
                        </div>
                    </div>
                    <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                        <div>
                            <label>登录密码：</label>
                            <input type="password" name="userPwd" class="form-control" placeholder="密码" required />
                        </div>
                        <div>
                            <label>年龄：</label>
                            <input type="number" name="userAge" class="form-control" placeholder="20" required />
                        </div>
                    </div>
                    <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                        <div>
                            <label>手机号码：</label>
                            <input type="text" name="userTel" class="form-control" placeholder="联系电话" required />
                        </div>
                        <div>
                            <label>性别：</label>
                            <select name="userSex" class="form-control">
                                <option value="男">男</option>
                                <option value="女">女</option>
                            </select>
                        </div>
                    </div>
                    <button type="submit" class="btn" style="background: linear-gradient(to right, var(--secondary-color), #0891b2);">执行 MyBatis 插入</button>
                </form>
            </div>
        </div>

        <div class="card" style="margin-bottom: 30px;">
            <div class="card-title">📋 实时商品库存数据汇总 (tb_goods)</div>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>商品编号(ID)</th>
                            <th>商品名</th>
                            <th>销售价格</th>
                            <th>所属品类</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="goods : ${goodsList}">
                            <td th:text="${goods.id}">1</td>
                            <td style="font-weight: 500;" th:text="${goods.name}">玫瑰花</td>
                            <td style="color: #e11d48; font-weight: bold;" th:text="'￥' + ${goods.price}">￥15.0</td>
                            <td><span class="badge" th:text="${goods.type}">植物</span></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="card">
            <div class="card-title">📋 系统注册用户信息汇总 (users)</div>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>账号 ID</th>
                            <th>真实姓名</th>
                            <th>年龄</th>
                            <th>性别</th>
                            <th>手机号</th>
                            <th>账号创建/同步时间</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="u : ${usersList}">
                            <td style="font-family: monospace;" th:text="${u.userId}">mrkj</td>
                            <td th:text="${u.userName}">明日科技</td>
                            <td th:text="${u.userAge}">20</td>
                            <td th:text="${u.userSex}">男</td>
                            <td th:text="${u.userTel}">138****5678</td>
                            <td style="color: var(--text-muted); font-size: 13px;" th:text="${#dates.format(u.createTime, 'yyyy-MM-dd HH:mm:ss')}">2026-05-16</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</body>
</html>
